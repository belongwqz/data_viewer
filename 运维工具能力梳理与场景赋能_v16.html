<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运维工具能力梳理与场景赋能</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  :root {
    --bg-deep: #06080f;
    --bg-card: #131829;
    --border-subtle: rgba(59,130,246,0.12);
    --border-active: rgba(59,130,246,0.35);
    --text-primary: #f0f4ff;
    --text-secondary: #a0aec0;
    --text-muted: #64748b;
    --accent-blue: #3b82f6;
    --accent-cyan: #22d3ee;
    --accent-purple: #8b5cf6;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-pink: #f472b6;
    --accent-red: #ef4444;
    --gradient-main: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #22d3ee 100%);
    --glow-blue: 0 0 25px rgba(59,130,246,0.2);
    --glow-cyan: 0 0 25px rgba(34,211,238,0.2);
    --glow-purple: 0 0 25px rgba(139,92,246,0.2);
    --glow-green: 0 0 25px rgba(16,185,129,0.2);
    --glow-amber: 0 0 25px rgba(245,158,11,0.2);
    --glow-pink: 0 0 25px rgba(244,114,182,0.2);
    --glow-red: 0 0 25px rgba(239,68,68,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-deep); color: var(--text-primary); overflow: hidden;
    height: 100vh; width: 100vw; position: relative;
  }

  /* ===== 背景动画 ===== */
  .bg-grid {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .bg-orb {
    position: fixed; border-radius: 50%; filter: blur(80px);
    opacity: 0.35; pointer-events: none; z-index: 0;
  }
  .bg-orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(59,130,246,0.25), transparent 70%); top: -150px; right: -100px; animation: floatOrb 20s ease-in-out infinite; }
  .bg-orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(139,92,246,0.2), transparent 70%); bottom: -100px; left: -80px; animation: floatOrb 25s ease-in-out infinite reverse; }
  .bg-orb-3 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(34,211,238,0.15), transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); animation: floatOrb 30s ease-in-out infinite; }
  .bg-orb-4 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(244,114,182,0.12), transparent 70%); top: 30%; left: 20%; animation: floatOrb 35s ease-in-out infinite; }
  @keyframes floatOrb {
    0%,100% { transform: translate(0,0) scale(1); }
    25% { transform: translate(20px,-15px) scale(1.08); }
    50% { transform: translate(-10px,20px) scale(0.95); }
    75% { transform: translate(15px,10px) scale(1.03); }
  }
  /* scan-line removed */

  /* ===== 幻灯片容器 ===== */
  .slide-container { position: relative; z-index: 1; width: 100vw; height: 100vh; overflow: hidden; }
  .slide {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; visibility: hidden; transition: all 0.7s cubic-bezier(0.4,0,0.2,1);
    transform: translateX(80px) scale(0.97); display: flex; align-items: center; justify-content: center;
    padding: 40px 80px;
  }
  .slide.active { opacity: 1; visibility: visible; transform: translateX(0) scale(1); z-index: 2; }
  .slide.prev { opacity: 0; visibility: hidden; transform: translateX(-80px) scale(0.97); }
  .slide-content {
    max-width: 1360px; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; gap: 0; padding: 10px 0;
  }

  /* ===== 导航栏 ===== */
  .fullscreen-btn {
    position: fixed; top: 12px; right: 24px; z-index: 1000;
    padding: 6px 14px; background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25);
    border-radius: 8px; color: var(--accent-cyan); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: all 0.25s; backdrop-filter: blur(10px);
  }
  .fullscreen-btn:hover { background: rgba(59,130,246,0.25); border-color: rgba(59,130,246,0.4); box-shadow: 0 0 15px rgba(59,130,246,0.3); }
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 52px;
    background: rgba(6,8,15,0.9); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(59,130,246,0.1); display: flex; align-items: center;
    justify-content: space-between; padding: 0 24px; z-index: 100;
  }
  .nav-left { display: flex; align-items: center; gap: 12px; }
  .nav-btn {
    width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03); border-radius: 8px; color: var(--text-secondary);
    font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
  }
  .nav-btn:hover { background: rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.4); color: #fff; box-shadow: 0 0 15px rgba(59,130,246,0.3); }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .slide-counter { font-size: 12px; color: var(--text-muted); min-width: 60px; text-align: center; }
  .slide-counter span { color: var(--accent-cyan); font-weight: 600; }
  .progress-bar { flex: 1; max-width: 180px; height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; margin: 0 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gradient-main); border-radius: 2px; transition: width 0.5s ease; box-shadow: 0 0 8px rgba(59,130,246,0.5); }
  .side-nav { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 100; }
  .side-dot {
    width: 8px; height: 8px; border: 1px solid rgba(255,255,255,0.12); border-radius: 50%;
    cursor: pointer; transition: all 0.3s; position: relative;
  }
  .side-dot:hover { border-color: var(--accent-cyan); transform: scale(1.4); box-shadow: 0 0 8px rgba(34,211,238,0.4); }
  .side-dot.active { background: var(--accent-cyan); border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(34,211,238,0.6); transform: scale(1.2); }
  .side-dot::before {
    content: attr(data-label); position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    font-size: 10px; color: var(--text-muted); white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .side-dot:hover::before { opacity: 1; }
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 44px;
    background: rgba(6,8,15,0.7); backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(59,130,246,0.06); display: flex;
    align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100;
  }
  .top-bar-title { font-size: 12px; color: var(--text-muted); }
  .top-bar-title .gradient-text {
    background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;
  }
  .top-bar-meta { font-size: 10px; color: var(--text-muted); display: flex; gap: 14px; }
  .keyboard-hint {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--text-muted); opacity: 0.5; z-index: 99;
    display: flex; align-items: center; gap: 6px; transition: opacity 0.5s;
  }
  .keyboard-hint.hidden { opacity: 0; pointer-events: none; }
  .key-hint { padding: 2px 7px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 3px; font-size: 9px; }

  /* ===== 动画 ===== */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(25px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeInScale { from { opacity:0; transform:scale(0.92); } to { opacity:1; transform:scale(1); } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  @keyframes shimmer { 0% { background-position:-200% center; } 100% { background-position:200% center; } }
  .animate-in { animation: fadeInUp 0.6s ease-out both; }
  .delay-1 { animation-delay: 0.06s; } .delay-2 { animation-delay: 0.12s; }
  .delay-3 { animation-delay: 0.18s; } .delay-4 { animation-delay: 0.24s; }
  .delay-5 { animation-delay: 0.30s; } .delay-6 { animation-delay: 0.36s; }
  .delay-7 { animation-delay: 0.42s; } .delay-8 { animation-delay: 0.48s; }

  .section-label { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-cyan); margin-bottom: 10px; font-weight: 500; }
  .section-title { font-size: 42px; font-weight: 800; margin-bottom: 22px; letter-spacing: -0.5px; }
  .gradient-text {
    background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% auto; animation: shimmer 3s linear infinite;
  }

  /* ===== 卡片通用 ===== */
  .category-card {
    background: rgba(19,24,41,0.7); border: 1px solid var(--border-subtle);
    border-radius: 14px; padding: 26px 30px; position: relative; overflow: hidden;
  }
  .category-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 14px 14px 0 0;
  }
  .category-card.red::before { background: linear-gradient(135deg, #ef4444, #f97316); }
  .category-card.blue::before { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .category-card.green::before { background: linear-gradient(135deg, #10b981, #059669); }
  .category-card.purple::before { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
  .category-card.amber::before { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .category-card.pink::before { background: linear-gradient(135deg, #f472b6, #ec4899); }
  .category-card-header { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .category-card-icon {
    width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 26px;
  }
  .category-card.red .category-card-icon { background: rgba(239,68,68,0.12); box-shadow: 0 0 12px rgba(239,68,68,0.15); }
  .category-card.blue .category-card-icon { background: rgba(59,130,246,0.12); box-shadow: 0 0 12px rgba(59,130,246,0.15); }
  .category-card.green .category-card-icon { background: rgba(16,185,129,0.12); box-shadow: 0 0 12px rgba(16,185,129,0.15); }
  .category-card.purple .category-card-icon { background: rgba(139,92,246,0.12); box-shadow: 0 0 12px rgba(139,92,246,0.15); }
  .category-card.amber .category-card-icon { background: rgba(245,158,11,0.12); box-shadow: 0 0 12px rgba(245,158,11,0.15); }
  .category-card.pink .category-card-icon { background: rgba(244,114,182,0.12); box-shadow: 0 0 12px rgba(244,114,182,0.15); }
  .category-card-name { font-size: 24px; font-weight: 700; }
  .category-card-en { font-size: 13px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
  .category-card-desc { font-size: 18px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }

  .attr-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .attr-tag {
    padding: 7px 16px; background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.15);
    border-radius: 6px; font-size: 15px; color: var(--accent-blue); font-weight: 500;
  }
  .data-source {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: rgba(255,255,255,0.02); border-radius: 7px; font-size: 15px; color: var(--text-secondary);
  }
  .source-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .source-dot.auto { background: var(--accent-green); box-shadow: 0 0 8px rgba(16,185,129,0.5); }
  .source-dot.manual { background: var(--accent-amber); box-shadow: 0 0 8px rgba(245,158,11,0.5); }
  .source-dot.api { background: var(--accent-purple); box-shadow: 0 0 8px rgba(139,92,246,0.5); }

  .services-list { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; justify-content: center; align-content: start; min-height: 0; }
  .service-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    border: 1px solid var(--border-subtle);
    border-radius: 10px; transition: all 0.3s;
  }
  .service-row:nth-child(odd) {
    background: rgba(19,24,41,0.55);
  }
  .service-row:nth-child(even) {
    background: rgba(19,24,41,0.35);
  }
  .service-row:hover { border-color: var(--border-active); transform: translateX(3px); }
  .service-row.red:hover { box-shadow: var(--glow-red); border-color: rgba(239,68,68,0.4); }
  .service-row.blue:hover { box-shadow: var(--glow-blue); border-color: rgba(59,130,246,0.4); }
  .service-row.green:hover { box-shadow: var(--glow-green); border-color: rgba(16,185,129,0.4); }
  .service-row.purple:hover { box-shadow: var(--glow-purple); border-color: rgba(139,92,246,0.4); }
  .service-row.amber:hover { box-shadow: var(--glow-amber); border-color: rgba(245,158,11,0.4); }
  .service-row.pink:hover { box-shadow: var(--glow-pink); border-color: rgba(244,114,182,0.4); }

  .service-num {
    width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0;
  }
  .service-num.red { background: rgba(239,68,68,0.15); color: var(--accent-red); }
  .service-num.blue { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
  .service-num.green { background: rgba(16,185,129,0.15); color: var(--accent-green); }
  .service-num.purple { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
  .service-num.amber { background: rgba(245,158,11,0.15); color: var(--accent-amber); }
  .service-num.pink { background: rgba(244,114,182,0.15); color: var(--accent-pink); }
  .service-icon { font-size: 22px; flex-shrink: 0; }
  .service-info { flex: 1; }
  .service-info h4 { font-size: 18px; font-weight: 600; margin-bottom: 3px; }
  .service-info p { font-size: 14px; color: var(--text-muted); }
  .service-status { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 6px rgba(16,185,129,0.5); }

  /* ===== Cover ===== */
  .cover-content { text-align: center; animation: fadeInScale 0.8s ease-out; }
  .cover-badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 22px;
    background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.18);
    border-radius: 100px; font-size: 13px; color: var(--accent-cyan);
    letter-spacing: 1px; margin-bottom: 32px;
  }
  .cover-badge .dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
  .cover-title { font-size: 68px; font-weight: 900; margin-bottom: 18px; line-height: 1.2; }
  .cover-subtitle { font-size: 22px; color: var(--text-secondary); font-weight: 300; margin-bottom: 48px; max-width: 700px; margin-left: auto; margin-right: auto; line-height: 1.6; }
  .cover-structure { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; }
  .cover-structure-item {
    display: flex; align-items: center; gap: 10px; padding: 12px 24px;
    background: rgba(19,24,41,0.8); border: 1px solid var(--border-subtle);
    border-radius: 10px; font-size: 16px; color: var(--text-secondary); transition: all 0.3s;
  }
  .cover-structure-item:hover { border-color: var(--border-active); box-shadow: var(--glow-blue); }
  .cover-structure-item .cs-icon { font-size: 18px; }
  .cover-structure-divider { display: flex; align-items: center; color: var(--accent-cyan); font-size: 24px; font-weight: 300; padding: 0 4px; }

  /* ===== 背景页（痛点/理念） ===== */
  .pain-points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 24px; }
  .pain-card {
    background: rgba(19,24,41,0.6); border: 1px solid var(--border-subtle);
    border-radius: 14px; padding: 28px 24px; transition: all 0.3s; text-align: center;
  }
  .pain-card:hover { border-color: var(--border-active); transform: translateY(-3px); box-shadow: var(--glow-red); }
  .pain-icon { font-size: 44px; margin-bottom: 14px; }
  .pain-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: var(--accent-red); }
  .pain-desc { font-size: 15px; color: var(--text-muted); line-height: 1.6; }

  .concept-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; margin-top: 24px; }
  .concept-card {
    background: rgba(19,24,41,0.6); border: 1px solid var(--border-subtle);
    border-radius: 14px; padding: 32px 28px; transition: all 0.3s; display: flex; gap: 24px; align-items: flex-start;
  }
  .concept-card:hover { border-color: var(--border-active); transform: translateY(-3px); box-shadow: var(--glow-cyan); }
  .concept-icon { font-size: 40px; flex-shrink: 0; }
  .concept-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .concept-desc { font-size: 16px; color: var(--text-secondary); line-height: 1.6; }

  /* ===== 总览 - 架构图风格 ===== */
  .overview-arch { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
  .arch-top { display: flex; justify-content: center; gap: 20px; }
  .arch-layer {
    background: rgba(19,24,41,0.7); border: 1px solid var(--border-subtle);
    border-radius: 12px; padding: 14px 18px; text-align: center;
    transition: all 0.3s; position: relative;
  }
  .arch-layer:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(59,130,246,0.15); }
  .arch-layer-icon { font-size: 24px; margin-bottom: 6px; }
  .arch-layer-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .arch-layer-desc { font-size: 11px; color: var(--text-muted); }
  .arch-layer.red { border-color: rgba(239,68,68,0.2); }
  .arch-layer.red:hover { border-color: rgba(239,68,68,0.5); box-shadow: 0 4px 20px rgba(239,68,68,0.15); }
  .arch-layer.blue { border-color: rgba(59,130,246,0.2); }
  .arch-layer.blue:hover { border-color: rgba(59,130,246,0.5); box-shadow: 0 4px 20px rgba(59,130,246,0.15); }
  .arch-layer.green { border-color: rgba(16,185,129,0.2); }
  .arch-layer.green:hover { border-color: rgba(16,185,129,0.5); box-shadow: 0 4px 20px rgba(16,185,129,0.15); }
  .arch-layer.purple { border-color: rgba(139,92,246,0.2); }
  .arch-layer.purple:hover { border-color: rgba(139,92,246,0.5); box-shadow: 0 4px 20px rgba(139,92,246,0.15); }
  .arch-layer.amber { border-color: rgba(245,158,11,0.2); }
  .arch-layer.amber:hover { border-color: rgba(245,158,11,0.5); box-shadow: 0 4px 20px rgba(245,158,11,0.15); }
  .arch-layer.pink { border-color: rgba(244,114,182,0.2); }
  .arch-layer.pink:hover { border-color: rgba(244,114,182,0.5); box-shadow: 0 4px 20px rgba(244,114,182,0.15); }
  .arch-center {
    background: rgba(34,211,238,0.06); border: 2px solid rgba(34,211,238,0.25);
    border-radius: 12px; padding: 18px 20px; text-align: center;
    transition: all 0.3s; position: relative;
  }
  .arch-center:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(34,211,238,0.2); }
  .arch-center-icon { font-size: 28px; margin-bottom: 8px; }
  .arch-center-title { font-size: 16px; font-weight: 700; color: var(--accent-cyan); margin-bottom: 4px; }
  .arch-center-desc { font-size: 12px; color: var(--text-muted); }
  .arch-connector {
    display: flex; justify-content: center; color: var(--accent-cyan);
    font-size: 18px; animation: pulse 2s infinite;
  }
  .arch-label {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    background: var(--bg-deep); padding: 2px 10px; border-radius: 4px;
    font-size: 10px; color: var(--accent-cyan); border: 1px solid rgba(34,211,238,0.3);
    white-space: nowrap;
  }

  /* ===== 总览 - 卡片网格 ===== */
  .overview-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;
  }
  .overview-item {
    background: rgba(19,24,41,0.6); border: 1px solid var(--border-subtle);
    border-radius: 14px; padding: 26px 24px; transition: all 0.3s; display: flex; flex-direction: column; gap: 12px;
  }
  .overview-item:hover { transform: translateY(-3px); border-color: var(--border-active); }
  .overview-item.red { border-left: 3px solid var(--accent-red); }
  .overview-item.red:hover { box-shadow: 0 4px 20px rgba(239,68,68,0.12); }
  .overview-item.blue { border-left: 3px solid var(--accent-blue); }
  .overview-item.blue:hover { box-shadow: 0 4px 20px rgba(59,130,246,0.12); }
  .overview-item.green { border-left: 3px solid var(--accent-green); }

// ===== Modal Popup =====
let isModalOpen = false;
function openModal(title, badge, badgeColor, items, extra) {
  const overlay = document.getElementById('modalOverlay');
  const titleEl = document.getElementById('modalTitle');
  const badgeEl = document.getElementById('modalBadge');
  const bodyEl = document.getElementById('modalBody');
  
  titleEl.textContent = title;
  badgeEl.textContent = badge;
  badgeEl.style.background = badgeColor === 'amber' ? 'rgba(245,158,11,0.12)' : badgeColor === 'green' ? 'rgba(16,185,129,0.12)' : badgeColor === 'purple' ? 'rgba(139,92,246,0.12)' : 'rgba(59,130,246,0.12)';
  badgeEl.style.color = badgeColor === 'amber' ? 'var(--accent-amber)' : badgeColor === 'green' ? 'var(--accent-green)' : badgeColor === 'purple' ? 'var(--accent-purple)' : 'var(--accent-blue)';
  badgeEl.style.border = `1px solid ${badgeColor === 'amber' ? 'rgba(245,158,11,0.25)' : badgeColor === 'green' ? 'rgba(16,185,129,0.25)' : badgeColor === 'purple' ? 'rgba(139,92,246,0.25)' : 'rgba(59,130,246,0.25)'}`;
  
  let html = '';
  if (extra) html += extra;
  html += '<ul class="modal-flow-grid">';
  items.forEach((item, i) => {
    html += `<li class="modal-flow-item"><span class="flow-num">${i + 1}</span>${item}</li>`;
  });
  html += '</ul>';
  bodyEl.innerHTML = html;
  
  overlay.classList.add('show');
  isModalOpen = true;
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  isModalOpen = false;
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
// ESC key closes modal only, no slide navigation
document.addEventListener('keydown', (e) => {
  if (isModalOpen && e.key === 'Escape') {
    e.preventDefault();
    e.stopPropagation();
    closeModal();
    return;
  }
  if (isModalOpen) {
    e.preventDefault();
    e.stopPropagation();
    return;
  }
});

// ===== Flow card click handlers =====
function setupFlowCards() {
  const cards = document.querySelectorAll('.slide-card-flow');
  cards.forEach(card => {
    card.style.cursor = 'pointer';
    card.addEventListener('mouseenter', function() {
      this.style.borderColor = 'rgba(239,68,68,0.4)';
      this.style.boxShadow = '0 0 15px rgba(239,68,68,0.1)';
      this.style.transform = 'translateY(-2px)';
    });
    card.addEventListener('mouseleave', function() {
      this.style.borderColor = 'rgba(239,68,68,0.12)';
      this.style.boxShadow = 'none';
      this.style.transform = 'none';
    });
    card.addEventListener('click', function(e) {
      e.stopPropagation();
      const title = this.dataset.title;
      const badge = this.dataset.badge;
      const badgeColor = this.dataset.badgeColor;
      const items = this.dataset.items.split('|').map(s => s.trim()).filter(s => s);
      const extra = this.dataset.extra || '';
      openModal(title, badge, badgeColor, items, extra);
    });
  });
}

      e.stopPropagation();
      const model = this.dataset.model;
      if (!model || !mcpModules[model]) return;
      
      const moduleData = mcpModules[model];
      const title = moduleData.name;
      const badge = moduleData.tools.length + '个工具';
      const items = moduleData.tools;
      
      // 构建多行多列卡片模式的 HTML
      let html = '';
      html += '<div class="mcp-module-info">';
      html += '<span>模块：</span>' + moduleData.model + ' | <span>描述：</span>' + moduleData.desc;
      html += '</div>';
      html += '<div class="mcp-card-grid">';
      items.forEach((item, i) => {
        html += '<div class="mcp-tool-card">';
        html += '<div class="mcp-tool-name">' + item.name + '</div>';
        if (item.description) {
          html += '<div class="mcp-tool-desc">' + item.description + '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
      
      const overlay = document.getElementById('modalOverlay');
      const titleEl = document.getElementById('modalTitle');
      const badgeEl = document.getElementById('modalBadge');
      const bodyEl = document.getElementById('modalBody');
      
      titleEl.textContent = title;
      badgeEl.textContent = badge;
      badgeEl.style.background = 'rgba(139,92,246,0.12)';
      badgeEl.style.color = 'var(--accent-purple)';
      badgeEl.style.border = '1px solid rgba(139,92,246,0.25)';
      
      bodyEl.innerHTML = html;
      overlay.classList.add('show');
      isModalOpen = true;
    });
  });
}

// ===== Fullscreen Toggle =====
let isFullscreen = false;
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().then(() => { isFullscreen = true; updateFullscreenButton(); }).catch(err => { console.log('Fullscreen error:', err); });
  } else {
    document.exitFullscreen().then(() => { isFullscreen = false; updateFullscreenButton(); });
  }
}
function updateFullscreenButton() {
  const text = document.querySelector('#fullscreenBtn .btn-text');
  text.textContent = isFullscreen ? '退出全屏' : '全屏';
}
document.addEventListener('fullscreenchange', () => { isFullscreen = !!document.fullscreenElement; updateFullscreenButton(); });

// ===== Slide Management =====
let currentSlideIndex = 0;
const totalSlides = slides.length;
const slideContainer = document.getElementById('slideContainer');

function buildSlides() {
  slides.forEach((slide, index) => {
    const div = document.createElement('div');
    div.className = 'slide' + (index === 0 ? ' active' : '');
    div.dataset.index = index;
    div.innerHTML = slide.content;
    slideContainer.appendChild(div);
  });
  const sideNav = document.getElementById('sideNav');
  slides.forEach((slide, index) => {
    const dot = document.createElement('div');
    dot.className = 'side-dot' + (index === 0 ? ' active' : '');
    dot.dataset.index = index;
    dot.dataset.label = slide.label;
    dot.onclick = () => goToSlide(index);
    sideNav.appendChild(dot);
  });
  document.getElementById('totalSlides').textContent = totalSlides;
}

function updateSlideClasses() {
  document.querySelectorAll('.slide').forEach((slide, index) => {
    slide.classList.remove('active', 'prev');
    if (index === currentSlideIndex) slide.classList.add('active');
    else if (index < currentSlideIndex) slide.classList.add('prev');
  });
  document.getElementById('currentSlide').textContent = currentSlideIndex + 1;
  document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
  document.getElementById('nextBtn').disabled = currentSlideIndex === totalSlides - 1;
  document.getElementById('progressFill').style.width = ((currentSlideIndex + 1) / totalSlides * 100) + '%';
  document.querySelectorAll('.side-dot').forEach((dot, index) => {
    dot.classList.toggle('active', index === currentSlideIndex);
  });
}

function nextSlide() { if (currentSlideIndex < totalSlides - 1) { currentSlideIndex++; updateSlideClasses(); } }
function prevSlide() { if (currentSlideIndex > 0) { currentSlideIndex--; updateSlideClasses(); } }
function goToSlide(index) { if (index >= 0 && index < totalSlides) { currentSlideIndex = index; updateSlideClasses(); } }

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  else if (e.key === 'Home') { e.preventDefault(); goToSlide(0); }
  else if (e.key === 'End') { e.preventDefault(); goToSlide(totalSlides - 1); }
});

let wheelTimeout;
document.addEventListener('wheel', (e) => {
  if (isModalOpen) {
    // 模态框打开时，允许模态框内滚动，但阻止页面切换
    e.stopPropagation();
    return; // 不触发页面切换
  }
  if (wheelTimeout) return;
  wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 800);
  if (e.deltaY > 0) nextSlide(); else prevSlide();
}, { passive: false });

let touchStartX = 0;
document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (isModalOpen) return;
  const diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 50) { if (diff > 0) nextSlide(); else prevSlide(); }
}, { passive: true });

      {name: "query_pilot_process_instance_name", description: "查询指定领航域（pilot domain）中某个标准服务（pilot_process）的所有运行实例名称（pilot_instance_name）。\n\n该工具用于获取指定服务下的所有可用实例列表，通常作为进一步查询（如 JVM 内存指标）的前置步骤。\n例如，用户需要查询某个服务的性能数据但不确定具体的实例名称时，可先调用此工具获取完整实例列表，\n再选择特定实例进行详细查询。"},
      {name: "query_jvm_heap_metrics", description: "查询指定进程的 JVM 堆内存 used, committed, max 数据。\nArgs:\n    pilot_domain (str): 必填。Pilot 域的名称，例如 \"Aroma2\", \"FLEET\"。用于确定数据源 ID。\n    pilot_process (str): 必填。要查询的进程名称，例如 \"AccessPointRouter\", \"AceDataService\"。\n    pilot_instance_name (str, optional): 可选。进程实例的名称，例如 \"0\", \"1\", \"2\", \"3\"。如果未提供，则默认全部可用的实例名。\n    start (int, optional): 可选。查询时间范围的开始时间戳（Unix 时间，秒）。如果未提供，则默认为当天凌晨时间00:00:01。\n    end (int, optional): 可选。查询时间范围的结束时间戳（Unix 时间，秒）。如果未提供，则默认为当前时间。\nReturns:\n    dict: 包含所有实例的字典，其中有每个实例包含 `used`、`committed` 和 `max` JVM 堆内存数据的子字典，以及 `service_info` 信息。其中 `service_info` 包含 pilot_domain、pilot_process、pilot_instance_name、pilot_instance_list。\n          如果查询过程中发生错误，将返回一个包含 \"error\" 键的字典。"},
      {name: "query_jvm_nonheap_metrics", description: "查询指定进程的 JVM 非堆内存 used, committed, max 数据。\nArgs:\n    pilot_domain (str): 必填。Pilot 域的名称，例如 \"Aroma2\", \"FLEET\"。用于确定数据源 ID。\n    pilot_process (str): 必填。要查询的进程名称，例如 \"AccessPointRouter\", \"AceDataService\"。\n    pilot_instance_name (str, optional): 可选。进程实例的名称，例如 \"0\", \"1\", \"2\", \"3\"。如果未提供，则默认全部可用的实例名。\n    start (int, optional): 可选。查询时间范围的开始时间戳（Unix 时间，秒）。如果未提供，则默认为当天凌晨时间00:00:01。\n    end (int, optional): 可选。查询时间范围的结束时间戳（Unix 时间，秒）。如果未提供，则默认为当前时间。\nReturns:\n    dict: 包含所有实例的字典，其中有每个实例包含 `used`、`committed` 和 `max` JVM 非堆内存数据的子字典，以及 `service_info` 信息。其中 `service_info` 包含 pilot_domain、pilot_process、pilot_instance_name、pilot_instance_list。\n          如果查询过程中发生错误，将返回一个包含 \"error\" 键的字典。"},
      {name: "query_jvm_total_metrics", description: "查询指定进程的 JVM 总内存 used, committed, max 数据。\nArgs:\n    pilot_domain (str): 必填。Pilot 域的名称，例如 \"Aroma2\", \"FLEET\"。用于确定数据源 ID。\n    pilot_process (str): 必填。要查询的进程名称，例如 \"AccessPointRouter\", \"AceDataService\"。\n    pilot_instance_name (str, optional): 可选。进程实例的名称，例如 \"0\", \"1\", \"2\", \"3\"。如果未提供，则默认全部可用的实例名。\n    start (int, optional): 可选。查询时间范围的开始时间戳（Unix 时间，秒）。如果未提供，则默认为当天凌晨时间00:00:01。\n    end (int, optional): 可选。查询时间范围的结束时间戳（Unix 时间，秒）。如果未提供，则默认为当前时间。\nReturns:\n    dict: 包含所有实例的字典，其中有每个实例包含 `used`、`committed` 和 `max` JVM 总内存数据的子字典，以及 `service_info` 信息。其中 `service_info` 包含 pilot_domain、pilot_process、pilot_instance_name、pilot_instance_list。\n          如果查询过程中发生错误，将返回一个包含 \"error\" 键的字典。"},
      {name: "query_jvm_file_descriptors", description: "查询指定进程的 JVM 文件描述符 的当前已打开文件描述符数据（process_files_open_files）、当前进程允许打开的最大文件描述符数量（process_files_max_files）。\nArgs:\n    pilot_domain (str): 必填。Pilot 域的名称，例如 \"Aroma2\", \"FLEET\"。用于确定数据源 ID。\n    pilot_process (str): 必填。要查询的进程名称，例如 \"AccessPointRouter\", \"AceDataService\"。\n    pilot_instance_name (str, optional): 可选。进程实例的名称，例如 \"0\", \"1\", \"2\", \"3\"。如果未提供，则默认全部可用的实例名。\n    start (int, optional): 可选。查询时间范围的开始时间戳（Unix 时间，秒）。如果未提供，则默认为当天凌晨时间00:00:01。\n    end (int, optional): 可选。查询时间范围的结束时间戳（Unix 时间，秒）。如果未提供，则默认为当前时间。\nReturns:\n\n    dict: 包含对应实例的metric字典，其中有如下key：__name__、host、instance、job、namespace、pilot_domain、pilot_group、pilot_instance_name、pilot_process\n    pod、service。values中涵盖时间戳对应的process_files_open_files或process_files_max_files\n          成功时，有 \"status\":\"success\"的键值对，否则为失败"},
      {name: "query_jvm_cpu_usage", description: "查询指定进程的 JVM cpu使用情况，涵盖系统cpu使用情况（system_cpu_usage）、进程cpu使用情况（process_cpu_usage）、进程cpu平均耗时（avg_over_time）。\nArgs:\n    pilot_domain (str): 必填。Pilot 域的名称，例如 \"Aroma2\", \"FLEET\"。用于确定数据源 ID。\n    pilot_process (str): 必填。要查询的进程名称，例如 \"AccessPointRouter\", \"AceDataService\"。\n    pilot_instance_name (str, optional): 可选。进程实例的名称，例如 \"0\", \"1\", \"2\", \"3\"。如果未提供，则默认全部可用的实例名。\n    start (int, optional): 可选。查询时间范围的开始时间戳（Unix 时间，秒）。如果未提供，则默认为当天凌晨时间00:00:01。\n    end (int, optional): 可选。查询时间范围的结束时间戳（Unix 时间，秒）。如果未提供，则默认为当前时间。\nReturns:\n\n    dict: 包含对应实例的metric字典，其中有如下key：__name__、host、instance、job、namespace、pilot_domain、pilot_group、pilot_instance_name、pilot_process\n    pod、service。values中涵盖时间戳对应的cpu使用情况\n          成功时，有 \"status\":\"success\"的键值对，否则为失败"},

      {name: "query_jvm_threads", description: "查询指定进程的 JVM 线程数据：当前前存活的线程数、当前存活的后台线程数、线程数的峰值、进程中的线程数量\nArgs:\n    pilot_domain (str): 必填。Pilot 域的名称，例如 \"Aroma2\", \"FLEET\"。用于确定数据源 ID。\n    pilot_process (str): 必填。要查询的进程名称，例如 \"AccessPointRouter\", \"AceDataService\"。\n    pilot_instance_name (str, optional): 可选。进程实例的名称，例如 \"0\", \"1\", \"2\", \"3\"。如果未提供，则默认全部可用的实例名。\n    start (int, optional): 可选。查询时间范围的开始时间戳（Unix 时间，秒）。如果未提供，则默认为当天凌晨时间00:00:01。\n    end (int, optional): 可选。查询时间范围的结束时间戳（Unix 时间，秒）。如果未提供，则默认为当前时间。\nReturns:\n    dict: 包含对应实例的metric字典，其中有如下key：__name__、host、instance、job、namespace、pilot_domain、pilot_group、pilot_instance_name、pilot_process\n    pod、service。values中涵盖时间戳和对应的数据\n    成功时，有 \"status\":\"success\"的键值对，否则为失败"},

  "VMWARE_MONITOR": {
    model: "VMWARE_MONITOR",
    name: "VMWARE监控",
    desc: "查询VMWARE监控的MCP",
    tools: [
      {name: "list_virtual_machines", description: "[READ] List virtual machines with optional filtering, sorting, and field selection.\n\n    Returns a dict: {total, mode, vms, hint}. Each VM entry includes a\n    ``folder_path`` field showing the vCenter inventory folder path\n    (e.g. ``/Colocation/Colo - ISER``).\n\n    Auto-compact: when no limit/fields are set and inventory exceeds 50 VMs,\n    returns compact fields (name, power_state, cpu, memory_mb, folder_path) to\n    keep context manageable. Set limit or fields to override.\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of VMs to return (None = all).\n        sort_by: Sort field: \"name\" | \"cpu\" | \"memory_mb\" | \"power_state\" | \"folder_path\".\n        power_state: Filter by power state: \"poweredOn\" | \"poweredOff\" | \"suspended\".\n        fields: Return only these fields (None = auto-select based on inventory size).\n            Available: name, power_state, cpu, memory_mb, guest_os, ip_address,\n                       host, uuid, tools_status, folder_path.\n        folder_filter: Case-insensitive substring match against folder_path.\n            Example: ``folder_filter=\"Colocation\"`` returns VMs anywhere under\n            a Colocation folder, including nested subfolders.\n    "},
      {name: "list_esxi_hosts", description: "[READ] List ESXi hosts with CPU cores, memory, version, VM count, and uptime.\n\n    When ``show_vms=True``, each host entry includes a ``vm_names`` list of all\n    registered VMs — no separate ``list_host_vms`` call needed for a quick survey.\n    Use ``list_host_vms(host_name)`` when you need per-VM details (power state,\n    IP, tools status).\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of hosts to return (None = all).\n        show_vms: When True, include VM names for each host (default False).\n    "},
      {name: "list_all_datastores", description: "[READ] List datastores with capacity, free space, type, and VM count.\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of datastores to return (None = all).\n    "},
      {name: "list_all_clusters", description: "[READ] List clusters with host count, DRS/HA status, and resource totals.\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of clusters to return (None = all).\n    "},
      {name: "list_all_networks", description: "[READ] List networks with name, attached VM count, and accessibility.\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of networks to return (None = all).\n    "},
      {name: "list_host_vms", description: "[READ] List VMs on a specific ESXi host with power state, CPU, IP, and tools status.\n\n    Directly queries the host's ``vm`` property — much faster than\n    ``list_virtual_machines`` + client-side filter on large inventories.\n    Returns each VM's name, power_state, cpu, memory_mb, guest_os, ip_address,\n    host, uuid, tools_status, and folder_path.\n\n    Args:\n        host_name: Exact ESXi host name (not IP — use ``list_esxi_hosts`` or\n            the CLI ``--by-ip`` to resolve IP to name first).\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of VMs to return (None = all).\n    "},
      {name: "vm_info_batch", description: "[READ] Get detailed info for multiple VMs in a single PropertyCollector call.\n\n    Replaces N individual ``vm_info`` calls when you need full detail\n    (CPU, memory, disks, NICs, host, folder path, OS, IP, tools status,\n    snapshot flag, annotation) for many VMs at once.\n\n    Args:\n        vm_names: Comma-separated VM names, e.g. ``\"vm-web-01,vm-db-02,vm-app-03\"``.\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n    "},
      {name: "get_alarms", description: "[READ] Get active/triggered alarms across the VMware inventory.\n\n    Each alarm includes suggested_actions with ready-to-use hints pointing to\n    the correct companion skill and tool for remediation.\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of alarms to return (None = all). Use when many alarms are active.\n    "},
      {name: "get_events", description: "[READ] Get recent vCenter/ESXi events filtered by severity.\n\n    Args:\n        hours: How many hours back to query (default 24).\n        severity: Minimum severity level: \"critical\", \"warning\", or \"info\".\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n    "},
      {name: "get_host_sensors", description: "[READ] Get hardware sensor status (temperature, voltage, fan, ...) for all hosts.\n\n    Each entry includes host, sensor_name, type, reading, unit, and status\n    (green/yellow/red from healthState.key). Use to spot failing hardware\n    before it causes an outage. Returns an empty list when no host exposes\n    sensor data (e.g. nested ESXi).\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of sensor rows to return (None = all).\n    "},
      {name: "get_host_services", description: "[READ] Get host service status (running state and startup policy).\n\n    Each entry includes host, service key, label, running (bool), and policy\n    (on/off/automatic). Use to check whether SSH, NTP, or the firewall service\n    is in the expected state.\n\n    Args:\n        host_name: Filter to a single host by exact name (None = all hosts).\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n    "},
      {name: "host_log_scan", description: "[READ] Scan recent ESXi host syslog lines for error/warning patterns.\n\n    Reads the last ``lines`` entries of the hostd/vmkernel/vpxa logs on each\n    host via the diagnostic system and returns only the lines matching known\n    trouble patterns (error, fail, critical, panic, lost access, timeout, …).\n    Each entry has severity, source (``host_log:<key>``), message, time, and\n    entity (host name). Returns an empty list when no matching lines are found.\n\n    Only errors/warnings are returned, not the full log, so output stays small\n    even on large clusters. Filter to one host with ``host_name`` to keep the\n    scan fast on environments with many hosts.\n\n    Args:\n        host_name: Filter to a single host by exact name (None = all hosts).\n        lines: How many recent lines per log to scan (default 500).\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n    "},
      {name: "vm_info", description: "[READ] Get detailed information about a specific VM (CPU, memory, disks, NICs, snapshots).\n\n    Args:\n        vm_name: Exact name of the virtual machine.\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n    "},
      {name: "vm_list_snapshots", description: "[READ] List all snapshots of a VM, including the nesting hierarchy.\n\n    Returns one entry per snapshot with name, description, created timestamp,\n    state, and level (0 = root; children are level+1). Returns an empty list\n    when the VM has no snapshots. Read-only — this skill cannot create,\n    revert, or delete snapshots (use vmware-aiops for those operations).\n    Exposes the same data as the CLI command `vmware-monitor vm snapshot-list`\n    (was missing from MCP until 2026-06-08 — CLI/MCP parity, 踩坑 #34).\n\n    Args:\n        vm_name: Exact name of the virtual machine.\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n    "},
      {name: "host_performance", description: "[READ] Real-time CPU/memory/disk/network utilisation per ESXi host.\n\n    Unlike list_esxi_hosts (static config: cores, total GB), this returns LIVE\n    utilisation from the 20-second PerfManager interval: cpu_usage_pct,\n    mem_usage_pct, mem_consumed_mb, disk_kbps, net_kbps. Busiest hosts first.\n    Disconnected hosts and hosts without a real-time provider are skipped (not\n    reported as zero). Point-in-time only — no historical trend is retained.\n\n    Args:\n        host_name: Filter to a single host by exact name (None = all hosts).\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of host rows to return (None = all).\n    "},
      {name: "vm_performance", description: "[READ] Real-time CPU/memory/disk/network utilisation per virtual machine.\n\n    LIVE utilisation (cpu_usage_pct, mem_usage_pct, mem_consumed_mb,\n    disk_read_kbps, disk_write_kbps, net_kbps), busiest VMs first. Only\n    powered-on VMs have a real-time provider; powered-off VMs are skipped.\n    Defaults to the top 25 — pass limit=None for the full fleet. Point-in-time\n    only; for trends use a metrics store.\n\n    Args:\n        vm_name: Filter to a single VM by exact name (None = all powered-on VMs).\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of VM rows to return (default 25; None = all).\n    "},
      {name: "snapshot_aging", description: "[READ] Sweep ALL VMs for snapshots and flag old / sprawling ones.\n\n    Where vm_list_snapshots covers one VM, this scans the whole inventory and\n    judges age. Returns {total_snapshots, old_snapshots, vms_with_snapshots,\n    threshold_days, snapshots[], hint}. Each row has age_days, is_old, and an\n    est_size_mb lower-bound (snapshotData+snapshotMemory; delta-disk growth is\n    not separable per-snapshot via the API). Read-only — delete snapshots via\n    vmware-aiops.\n\n    Args:\n        age_threshold_days: Age above which a snapshot is flagged \"old\" (default 30).\n        only_old: When True, return only snapshots older than the threshold.\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of snapshot rows to return (None = all).\n    "},
      {name: "certificate_status", description: "[READ] Per-host ESXi management certificate expiry.\n\n    An expired ESXi cert drops host management — this surfaces it before the\n    outage. Returns host, not_after, days_until_expiry, and an ``expiring`` flag\n    (within warn_days or already expired), soonest-to-expire first. Uses the\n    API-native certificateInfo (no PEM parsing).\n\n    Args:\n        warn_days: Flag certs expiring within this many days (default 30).\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of host rows to return (None = all).\n    "},
      {name: "license_status", description: "[READ] vCenter/ESXi license inventory with usage and expiry.\n\n    Returns one row per license: name, edition_key, total/used units,\n    unlimited flag (total==0), and expiration. Use to catch over-allocation or\n    an approaching license expiry.\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n    "},
      {name: "ntp_status", description: "[READ] Per-host NTP configuration health (servers + ntpd service state).\n\n    Returns host, ntp_servers, ntpd_running, ntpd_policy, and a ``healthy`` flag\n    (servers configured AND ntpd running). NOTE: the SOAP API does not expose\n    the live clock offset/stratum — this reports configuration health only (the\n    actionable signal). For actual offset use esxcli on the host.\n\n    Args:\n        host_name: Filter to a single host by exact name (None = all hosts).\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n    "},
      {name: "datastore_capacity", description: "[READ] Per-datastore capacity with thin-provisioning over-commit.\n\n    Adds the risk signal list_all_datastores lacks: overcommit_pct\n    (provisioned / capacity * 100). Over 100% means more space is promised to\n    VMs than physically exists — a thin datastore can fill up while still\n    showing free space. Returns capacity_gb, free_gb, committed_gb,\n    provisioned_gb, used_pct, overcommit_pct; riskiest first. Point-in-time.\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of datastore rows to return (None = all).\n    "},
      {name: "resource_pool_usage", description: "[READ] Per-resource-pool CPU/memory reservation, limit, and current usage.\n\n    Returns name, cpu_reservation_mhz, cpu_limit_mhz, cpu_usage_mhz,\n    mem_reservation_mb, mem_limit_mb, mem_usage_mb. A limit of -1 means\n    unlimited. Use to spot pools near their reservation/limit. Sorted by memory\n    usage descending.\n\n    Args:\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of pool rows to return (None = all).\n    "},
      {name: "active_tasks", description: "[READ] In-flight (and optionally just-completed) vCenter tasks.\n\n    Answers \"why is the cluster busy?\". Returns name, entity, state,\n    progress_pct, start_time, user, active flag, and error (for failed recent\n    tasks). Running/queued first. Read-only — cancel tasks via vmware-aiops.\n\n    Args:\n        include_recent: Also include recently completed/failed tasks (default True).\n        target: Optional vCenter/ESXi target name from config. Uses default if omitted.\n        limit: Max number of task rows to return (None = all).\n    "},

function setupMCPModal() {
  const cards = document.querySelectorAll('.mcp-card');
  cards.forEach(card => {
    card.style.cursor = 'pointer';
    card.addEventListener('mouseenter', function() {
      this.style.borderColor = 'rgba(139,92,246,0.5)';
      this.style.boxShadow = '0 0 15px rgba(139,92,246,0.2)';
      this.style.transform = 'translateY(-2px)';
    });
    card.addEventListener('mouseleave', function() {
      this.style.borderColor = 'rgba(139,92,246,0.12)';
      this.style.boxShadow = 'none';
      this.style.transform = 'none';
    });
    card.addEventListener('click', function(e) {
      e.stopPropagation();
      const modelKey = this.dataset.model;
      if (!modelKey || !mcpModules[modelKey]) return;
      
      const moduleData = mcpModules[modelKey];
      const title = moduleData.model;
      const badge = moduleData.tools.length + '个工具';
      const items = moduleData.tools;
      
      // 构建多行多列卡片模式的 HTML
      let html = '';
      html += '<div class="mcp-module-info">';
      html += '<span>模块：</span>' + moduleData.model + ' | <span>描述：</span>' + moduleData.desc;
      html += '</div>';
      html += '<div class="mcp-card-grid">';
      items.forEach((item, i) => {
        html += '<div class="mcp-tool-card">';
        html += '<div class="mcp-tool-name">' + item.name + '</div>';
        if (item.description) {
          html += '<div class="mcp-tool-desc">' + item.description + '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
      
      const overlay = document.getElementById('modalOverlay');
      const titleEl = document.getElementById('modalTitle');
      const badgeEl = document.getElementById('modalBadge');
      const bodyEl = document.getElementById('modalBody');
      
      titleEl.textContent = title;
      badgeEl.textContent = badge;
      badgeEl.style.background = 'rgba(139,92,246,0.12)';
      badgeEl.style.color = 'var(--accent-purple)';
      badgeEl.style.border = '1px solid rgba(139,92,246,0.25)';
      
      bodyEl.innerHTML = html;
      overlay.classList.add('show');
      isModalOpen = true;
    });
  });
}

let isViewModalOpen = false;

function showViewModal(key, count, name) {
  if (!viewData || !viewData[key]) return;
  
  const items = viewData[key];
  const totalCount = parseInt(count);
  
  let html = '';
  html += '<div class="modal-header">';
  html += '<span class="modal-title">' + name + '</span>';
  html += '<span class="modal-badge">' + items.length + ' / ' + totalCount + ' 条</span>';
  html += '<button class="modal-close" onclick="closeViewModal()">✕</button>';
  html += '</div>';
  
  html += '<div class="modal-desc">';
  html += '📊 本类别共 <strong style="color:var(--accent-green);">' + totalCount + '</strong> 个视图，';
  html += '当前展示前 <strong style="color:var(--accent-cyan);">21</strong> 条（按导入顺序）<br>';
  html += '📅 数据来源：CMDB 新老视图 + 稽核视图，<span style="color:var(--accent-green);font-weight:600;">全量共 1,177 个视图</span>';
  html += '</div>';
  
  html += '<table class="modal-table">';
  html += '<thead><tr><th class="id">ID</th><th class="name">视图名称</th><th class="type">类型</th><th class="source">来源</th><th class="models">关联模型</th></tr></thead>';
  html += '<tbody>';
  
  items.forEach(function(item, i) {
    html += '<tr>';
    html += '<td class="id">' + item.id + '</td>';
    html += '<td class="name">' + item.name + '</td>';
    html += '<td class="type"><span style="color:' + (item.type === 'public' ? 'var(--accent-green)' : item.type === 'private' ? 'var(--accent-amber)' : 'var(--text-muted)') + '">' + item.type + '</span></td>';
    html += '<td class="source">' + item.source + '</td>';
    html += '<td class="models">' + item.关联模型 + '</td>';
    html += '</tr>';
  });
  
  html += '</tbody></table>';
  html += '<div class="modal-hint">💡 提示：关联模型字段逗号分隔，可查看具体关联的 CMDB 模型</div>';
  
  const overlay = document.getElementById('viewModalOverlay');
  const body = document.getElementById('viewModalBody');
  
  if (overlay && body) {
    body.innerHTML = html;
    overlay.classList.add('show');
    isViewModalOpen = true;
  }
}

function closeViewModal() {
  const overlay = document.getElementById('viewModalOverlay');
  if (overlay) {
    overlay.classList.remove('show');
    isViewModalOpen = false;
  }
}

// 点击遮罩关闭
document.addEventListener('click', function(e) {
  if (isViewModalOpen && e.target.id === 'viewModalOverlay') {
    closeViewModal();
  }
});
